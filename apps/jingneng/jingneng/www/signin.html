<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>登录 · 京能协作</title>
  <link rel="icon" type="image/svg+xml" href="/assets/jingneng/images/favicon.svg">
  <link rel="stylesheet" href="/assets/jingneng/workbench/workbench.css?v={{ asset_version }}">
  <link rel="stylesheet" href="/assets/jingneng/css/signin.css?v={{ asset_version }}">
</head>
<body class="signin-page">
  <main class="signin-card">
    <div class="brand"><span class="brand-mark">京</span><span class="brand-text">京能协作<small>工作空间</small></span></div>
    <h1>登录工作空间</h1>
    <form id="signin-form">
      <label for="account">账号<input id="account" name="username" autocomplete="username" required autofocus placeholder="邮箱或管理员账号"></label>
      <label for="password">密码<input id="password" name="password" type="password" autocomplete="current-password" required></label>
      <label class="show-password"><input id="show-password" type="checkbox">显示密码</label>
      <p id="signin-error" class="message error" role="alert" hidden></p>
      <button id="signin-submit" class="button primary" type="submit">登录</button>
      <p id="signin-progress" role="status" hidden>正在登录…</p>
    </form>
    <div class="signin-footer"><span class="environment-label">演示空间</span></div>
  </main>
  <script src="/assets/jingneng/js/signin.js?v={{ asset_version }}" defer></script>
</body>
</html>
