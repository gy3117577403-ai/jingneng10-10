user www-data;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_max_body_size 50m;
    # Preserve the published port for Laravel URLs, accepting only demo hosts.
    map $http_host $sem_http_host {
        default '';
        ~^127\.0\.0\.1(:[0-9]+)?$ $http_host;
        ~^localhost(:[0-9]+)?$ $http_host;
    }
    server {
        listen 8080;
        server_name 127.0.0.1 localhost;
        if ($sem_http_host = '') { return 400; }
        root /app/public;
        index index.php;
        add_header X-Content-Type-Options nosniff always;
        location ~ \.mjs$ {
            types { text/javascript mjs; }
            try_files $uri =404;
        }
        location ~ \.wasm$ {
            types { application/wasm wasm; }
            try_files $uri =404;
        }
        location / { try_files $uri $uri/ /index.php?$query_string; }
        location ~ \.php$ {
            try_files $uri =404;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTP_HOST $sem_http_host;
            fastcgi_pass app:9000;
            fastcgi_read_timeout 120s;
        }
        location ~ /\. { deny all; }
    }
}
