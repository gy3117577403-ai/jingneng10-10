name: Runtime foundation

on:
  push:
    paths:
      - 'apps/**'
      - 'infra/**'
      - 'scripts/dev.py'
      - 'scripts/smoke.py'
      - 'compose.yaml'
      - '.dockerignore'
      - '.env.example'
      - '.github/workflows/foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate source and configuration
        run: |
          python3 -m compileall -q apps infra/runtime scripts
          node --check apps/jingneng/jingneng/public/js/foundation.js
          python3 scripts/dev.py init-env
          docker compose config --quiet
      - name: Build and start an isolated demonstration site
        run: python3 scripts/dev.py start
      - name: Verify APIs, permissions, worker and private file upload
        run: python3 scripts/smoke.py --prepare-restart
      - name: Repeat initialization and restart services
        run: |
          docker compose run --rm init-site
          python3 scripts/dev.py restart
      - name: Verify retained data and file hashes
        run: python3 scripts/smoke.py --verify-restart
      - name: Verify repeatable database and file backups
        run: |
          python3 scripts/dev.py backup
          python3 scripts/dev.py backup
      - name: Diagnostic logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100
